trigger: none

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: nodeVersion
    type: string
    default: 22.22.2

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    # Update the pool with your team's 1ES hosted pool.
    # Update the pool with your team's 1ES hosted pool.
    pool:
      name: staging-pool-amd64-mariner-2
      image: 1es-azlinux-3-amd64-custom-disk
      os: linux
      hostArchitecture: amd64
    sdl:
      sourceAnalysisPool:
        name: staging-pool-amd64-mariner-2
        image: azcu-agent-amd64-windows-22-img
        os: windows
        hostArchitecture: amd64
      git:
        submodules: false
        longpaths: true

    stages:
      - stage: Stage
        jobs:
          - job: Arm64Job
            timeoutInMinutes: 120
            pool:
              name: staging-pool-arm64-mariner-2
              image: 1es-azlinux-3-arm64-custom-disk
              os: linux
              hostArchitecture: arm64
            variables:
              NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
              NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs
              PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
              GOMODCACHE: $(Pipeline.Workspace)/.go/pkg/mod
              GOCACHE: $(Pipeline.Workspace)/.go/build
              ARCH: arm64
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(Pipeline.Workspace)/aks-desktop-linux-arm64-unsigned
                artifactName: aks-desktop-linux-arm64-unsigned
            steps:
              - checkout: self
                submodules: false

              - task: NodeTool@0
                displayName: Install Node.js
                retryCountOnTaskFailure: 3
                inputs:
                  versionSpec: ${{ parameters.nodeVersion }}

              - bash: |
                  set -e
                  go_version="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)"
                  echo "Headlamp Go toolchain: $go_version"
                  echo "##vso[task.setvariable variable=HEADLAMP_GO_VERSION]$go_version"
                displayName: Resolve Headlamp Go version

              - task: GoTool@0
                displayName: Install Go
                retryCountOnTaskFailure: 3
                inputs:
                  version: $(HEADLAMP_GO_VERSION)
              - bash: |
                  set -e
                  mkdir -p "$(GOMODCACHE)" "$(GOCACHE)"
                  echo "GOMODCACHE=$(go env GOMODCACHE)"
                  echo "GOCACHE=$(go env GOCACHE)"
                  echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
                displayName: 'Configure Go caches'

              - task: Cache@2
                displayName: 'Cache Go module downloads'
                inputs:
                  key: 'go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOMODCACHE)'
                  cacheHitVar: GO_MODULE_CACHE_HIT

              - task: Cache@2
                displayName: 'Cache Go build outputs'
                inputs:
                  key: 'go-build-v3 | "$(Agent.OS)" | "$(ARCH)" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-build-v3 | "$(Agent.OS)" | "$(ARCH)" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOCACHE)'
                  cacheHitVar: GO_BUILD_CACHE_HIT

              - bash: |
                  echo "[build-timing] Go module cache result: $(GO_MODULE_CACHE_HIT)"
                  echo "[build-timing] Go build cache result: $(GO_BUILD_CACHE_HIT)"
                displayName: 'Report Go cache results'
              - bash: |
                  set -e
                  echo "=== INSTALL BUILD PREREQUISITES START ==="
                  packages=()
                  command -v ld >/dev/null 2>&1 || packages+=(binutils)
                  command -v make >/dev/null 2>&1 || packages+=(make)

                  if [ "${#packages[@]}" -gt 0 ]; then
                    echo "Installing via tdnf: ${packages[*]}"
                    if [ "$(id -u)" -eq 0 ]; then
                      tdnf install -y "${packages[@]}"
                    else
                      sudo -n tdnf install -y "${packages[@]}"
                    fi
                  else
                    echo "Build prerequisites are already installed."
                  fi

                  command -v tar >/dev/null # Missing extraction/compression tooling must fail verification.
                  echo "Installed build prerequisites:"
                  ld --version | head -n 1
                  make --version | head -n 1
                  echo "=== INSTALL BUILD PREREQUISITES END ==="
                displayName: "Install build prerequisites"
              - bash: |
                  set -euo pipefail
                  export GOPROXY="https://proxy.golang.org,direct"
                  export GOSUMDB="sum.golang.org"
                  export GONOPROXY=""
                  export GOPRIVATE=""
                  unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy NO_PROXY no_proxy
                  npm ci --prefix .config/npm --ignore-scripts --no-audit --no-fund
                  echo "##vso[task.prependpath]$PWD/.config/npm/node_modules/.bin"
                  export PATH="$PWD/.config/npm/node_modules/.bin:$PATH"
                  npm ci --prefer-offline --no-audit --no-fund
                  npm run build:linux:arm64
                  npm run test:post-build
                  version="$(node -p "require('./package.json').version")"
                  dist="node_modules/@headlamp-k8s/headlamp-source/source/app/dist"
                  stage="$(Pipeline.Workspace)/aks-desktop-linux-arm64-unsigned"
                  npm exec -- tsx build/linux-package-verification.ts --stage-from="$dist" --dir="$stage" --version="$version" --arches=arm64
                  npm exec -- tsx build/linux-package-verification.ts --dir="$stage" --version="$version" --arches=arm64
                displayName: Build and verify native ARM64 unsigned packages
                env:
                  BUILD_BUILDNUMBER: $(Build.BuildNumber)

          - job: HostJob
            dependsOn: Arm64Job
            timeoutInMinutes: 120
            variables:
              NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
              NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs
              # Bundled Azure CLI dependencies cannot reach pypi.org from this pool.
              PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
              GOMODCACHE: $(Pipeline.Workspace)/.go/pkg/mod
              GOCACHE: $(Pipeline.Workspace)/.go/build
              ARCH: x64
            # If the pipeline publishes artifacts, use `templateContext` to define the artifacts.
            # This will enable 1ES PT to run SDL analysis tools on the artifacts and then upload them.
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(Pipeline.Workspace)/aks-desktop-deb-unsigned
                artifactName: aks-desktop-signed
            # # Define the steps that the pipeline will run.
            # # In most cases, copy and paste the steps from the original pipeline.
            steps:
              - checkout: self
                submodules: false

              - task: NodeTool@0
                displayName: Install Node.js
                retryCountOnTaskFailure: 3
                inputs:
                  versionSpec: ${{ parameters.nodeVersion }}

              - bash: |
                  set -e
                  go_version="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)"
                  echo "Headlamp Go toolchain: $go_version"
                  echo "##vso[task.setvariable variable=HEADLAMP_GO_VERSION]$go_version"
                displayName: Resolve Headlamp Go version

              - task: GoTool@0
                displayName: Install Go
                retryCountOnTaskFailure: 3
                inputs:
                  version: $(HEADLAMP_GO_VERSION)
              # FIX: Install .NET SDK early (required for ESRP Code Signing)
              # Changed from "runtime" to "sdk" and added version specification
              - task: UseDotNet@2
                displayName: Install .NET SDK (required for ESRP signing)
                inputs:
                  packageType: "sdk"
                  version: "6.x" # Use 6.x or 8.x depending on ESRP requirement
              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  echo "=== GO INSTALLATION DEBUG ==="
                  echo "Go version requested: $(HEADLAMP_GO_VERSION)"
                  go version || echo "Go not found in PATH"
                  echo "GOROOT: $GOROOT"
                  echo "GOPATH: $GOPATH"
                  echo "PATH: $PATH"
                  echo "=== END GO DEBUG ==="
                displayName: "Debug: Go Installation"
              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  echo "=== NODE.JS INSTALLATION DEBUG ==="
                  echo "Node version requested: ${{ parameters.nodeVersion }}"
                  node --version || echo "Node not found in PATH"
                  npm --version || echo "NPM not found in PATH"
                  echo "NODE_PATH: $NODE_PATH"
                  echo "PATH: $PATH"
                  echo "=== END NODE.JS DEBUG ==="
                displayName: "Debug: Node.js Installation"
              - bash: |
                  set -e
                  mkdir -p "$(GOMODCACHE)" "$(GOCACHE)"
                  echo "GOMODCACHE=$(go env GOMODCACHE)"
                  echo "GOCACHE=$(go env GOCACHE)"
                  echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
                displayName: 'Configure Go caches'

              - task: Cache@2
                displayName: 'Cache Go module downloads'
                inputs:
                  key: 'go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOMODCACHE)'
                  cacheHitVar: GO_MODULE_CACHE_HIT

              - task: Cache@2
                displayName: 'Cache Go build outputs'
                inputs:
                  key: 'go-build-v3 | "$(Agent.OS)" | "$(ARCH)" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-build-v3 | "$(Agent.OS)" | "$(ARCH)" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOCACHE)'
                  cacheHitVar: GO_BUILD_CACHE_HIT

              - bash: |
                  echo "[build-timing] Go module cache result: $(GO_MODULE_CACHE_HIT)"
                  echo "[build-timing] Go build cache result: $(GO_BUILD_CACHE_HIT)"
                displayName: 'Report Go cache results'
              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  echo "=== CHECKOUT DEBUG ==="
                  echo "Current working directory: $(pwd)"
                  echo "Repository contents:"
                  ls -la
                  echo "Git branch:"
                  git branch -a || echo "Git not available"
                  echo "Git commit:"
                  git log --oneline -1 || echo "Git not available"
                  echo "=== END CHECKOUT DEBUG ==="
                displayName: "Debug: Checkout"
              - bash: |
                  set -e
                  echo "=== INSTALL BUILD PREREQUISITES START ==="
                  packages=()
                  command -v ld >/dev/null 2>&1 || packages+=(binutils)
                  command -v make >/dev/null 2>&1 || packages+=(make)

                  if [ "${#packages[@]}" -gt 0 ]; then
                    echo "Installing via tdnf: ${packages[*]}"
                    if [ "$(id -u)" -eq 0 ]; then
                      tdnf install -y "${packages[@]}"
                    else
                      sudo -n tdnf install -y "${packages[@]}"
                    fi
                  else
                    echo "Build prerequisites are already installed."
                  fi

                  command -v tar >/dev/null # Missing extraction/compression tooling must fail verification.
                  echo "Installed build prerequisites:"
                  ld --version | head -n 1
                  make --version | head -n 1
                  echo "=== INSTALL BUILD PREREQUISITES END ==="
                displayName: "Install build prerequisites"
              # Build the Windows application
              - bash: |
                  set -e  # fail the step when the build fails
                  echo "=== BUILD DEBUG START ==="
                  echo "Current working directory: $(pwd)"
                  echo "Node version: $(node --version)"
                  echo "NPM version: $(npm --version)"
                  echo "Go version: $(go version)"
                  echo "Package.json exists: $([ -f package.json ] && echo 'YES' || echo 'NO')"
                  echo "NPM scripts available:"
                  npm run 2>/dev/null | grep -E "build|win" || echo "No build scripts found"
                  echo "=== BUILD DEBUG END ==="

                  # Fix Go proxy configuration - override any problematic ADO settings
                  export GOPROXY="https://proxy.golang.org,direct"
                  export GOSUMDB="sum.golang.org"
                  export GONOPROXY=""
                  export GOPRIVATE=""
                  # Clear any proxy environment variables that might interfere
                  unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy NO_PROXY no_proxy

                  echo "=== GO ENVIRONMENT ==="
                  echo "GOPROXY=$GOPROXY"
                  echo "GOSUMDB=$GOSUMDB"
                  go env | grep -E "GOPROXY|GOSUMDB|PROXY"
                  echo "=== END GO ENVIRONMENT ==="

                  npm ci --prefix .config/npm --ignore-scripts --no-audit --no-fund
                  echo "##vso[task.prependpath]$PWD/.config/npm/node_modules/.bin"
                  export PATH="$PWD/.config/npm/node_modules/.bin:$PATH"
                  npm ci --prefer-offline --no-audit --no-fund
                  echo "Building AKS desktop Linux application..."
                  # TODO: Restore the app smoke when the image includes Electron runtime libraries.
                  if ! npm run build:linux || \
                    ! npm run test:post-build; then
                    exit 1
                  fi
                  echo "✅ Build complete"

                  echo "=== POST-BUILD DEBUG ==="
                  echo "Checking for build outputs..."
                  find . -name "*.deb" -type f 2>/dev/null || echo "No .deb files found"
                  echo "Headlamp app dist contents:"
                  ls -la node_modules/@headlamp-k8s/headlamp-source/source/app/dist/ 2>/dev/null || echo "Headlamp app dist not found"
                  echo "=== END POST-BUILD DEBUG ==="
                displayName: "Build AKS desktop (Linux)"
                env:
                  BUILD_BUILDNUMBER: $(Build.BuildNumber)

              - task: DownloadPipelineArtifact@2
                displayName: Download native ARM64 unsigned packages
                inputs:
                  artifactName: aks-desktop-linux-arm64-unsigned
                  targetPath: $(Pipeline.Workspace)/arm64-download

              # Select exact native packages, validate the downloaded producer, then collect.
              - bash: |
                  set -e  # fail on error
                  echo "=== COPY EXECUTABLE DEBUG START ==="
                  echo "Current working directory: $(pwd)"
                  echo "Pipeline workspace: $(Pipeline.Workspace)"
                  echo "Searching for aks-desktop*.deb and *.tar.gz files..."

                  # TODO: Remove debug logging after pipeline is stable
                  echo "All .deb files in current directory:"
                  find . -name "*.deb" -type f 2>/dev/null || echo "No .deb files found"

                  echo "All .tar.gz files in current directory:"
                  find . -name "*.tar.gz" -type f 2>/dev/null || echo "No .tar.gz files found"

                  echo "Headlamp app dist directory contents:"
                  ls -la node_modules/@headlamp-k8s/headlamp-source/source/app/dist/ 2>/dev/null || echo "Headlamp app dist directory not found"

                  echo "=== COPY EXECUTABLE DEBUG END ==="

                  version="$(node -p "require('./package.json').version")"
                  dist="node_modules/@headlamp-k8s/headlamp-source/source/app/dist"
                  stage="$(Pipeline.Workspace)/aks-desktop-deb-unsigned"
                  arm="$(Pipeline.Workspace)/arm64-download"
                  npm exec -- tsx build/linux-package-verification.ts --dir="$arm" --version="$version" --arches=arm64
                  npm exec -- tsx build/linux-package-verification.ts --stage-from="$dist" --dir="$stage" --version="$version" --arches=x64
                  cp "$arm/aks-desktop_${version}-1_arm64.deb" "$stage/"
                  cp "$arm/aks-desktop-${version}-linux-arm64.tar.gz" "$stage/"

                  # TODO: Remove debug logging after pipeline is stable
                  echo "Verifying copy:"
                  ls -la "$(Pipeline.Workspace)/aks-desktop-deb-unsigned/"
                displayName: "Copy built DEB and tar.gz files to workspace directory"
                env:
                  BUILD_BUILDNUMBER: $(Build.BuildNumber)

              # Verify contents in workspace directory
              - bash: |
                  echo "=== VERIFICATION DEBUG START ==="
                  echo "Pipeline workspace: $(Pipeline.Workspace)"
                  echo "Target directory: $(Pipeline.Workspace)/aks-desktop-deb-unsigned"

                  # TODO: Remove debug logging after pipeline is stable
                  echo "Directory exists: $([ -d "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" ] && echo 'YES' || echo 'NO')"
                  echo "Directory permissions:"
                  ls -ld "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" 2>/dev/null || echo "Directory not found"

                  echo "Listing workspace directory contents..."
                  ls -la "$(Pipeline.Workspace)/aks-desktop-deb-unsigned"

                  echo "File count: $(find "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" -type f | wc -l)"
                  echo "Total size: $(du -sh "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" 2>/dev/null || echo 'Unable to calculate size')"

                  echo "=== VERIFICATION DEBUG END ==="
                displayName: "List the unsigned dir"

              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  set -euo pipefail
                  version="$(node -p "require('./package.json').version")"
                  stage="$(Pipeline.Workspace)/aks-desktop-deb-unsigned"
                  npm exec -- tsx build/linux-package-verification.ts --dir="$stage" --version="$version" --arches=x64,arm64
                  echo "=== SIGNING DEBUG START ==="
                  echo "About to start ESRP code signing..."
                  echo "Target folder: $(Pipeline.Workspace)/aks-desktop-deb-unsigned"
                  echo "Pattern: *.deb"
                  echo "Files to be signed:"
                  find "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" -name "*.deb" -type f || echo "No .deb files found"
                  echo "ESRP Service: ESRP-AME-AZCU"
                  echo "Key Vault: upstreamci-ado"
                  echo "Certificate: azcu-ersp-corp"
                  echo "=== SIGNING DEBUG END ==="
                displayName: "Debug: Pre-Signing"
                env:
                  BUILD_BUILDNUMBER: $(Build.BuildNumber)
              - task: EsrpCodeSigning@5
                displayName: "ESRP CodeSigning"
                condition: succeeded()
                inputs:
                  ConnectedServiceName: "ESRP-AME-AZCU"
                  UseMSIAuthentication: true
                  AppRegistrationClientId: "70ebf75b-d46f-46da-90e6-1fa654251514"
                  AppRegistrationTenantId: "33e01921-4d64-4f8c-a055-5bdaffd5e33d"
                  EsrpClientId: "150f8d2b-ad88-4a27-b782-c9bc3b028430"
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
                  AuthAKVName: "upstreamci-ado"
                  AuthSignCertName: 'azcu-ersp-corp'
                  FolderPath: "$(Pipeline.Workspace)/aks-desktop-deb-unsigned"
                  Pattern: "*.deb"
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                        {
                            "KeyCode" : "CP-450779-Pgp",
                            "OperationCode" : "LinuxSign",
                            "Parameters" : {},
                            "ToolName" : "sign",
                            "ToolVersion" : "1.0"
                        }
                    ]
              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  echo "=== POST-SIGNING DEBUG START ==="
                  echo "Signing completed, verifying results..."
                  echo "Signed files in workspace:"
                  find "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" -name "*.deb" -type f || echo "No .deb files found"

                  # Check if files are actually signed (this is a basic check)
                  for deb_file in "$(Pipeline.Workspace)/aks-desktop-deb-unsigned"/*.deb; do
                    if [ -f "$deb_file" ]; then
                      echo "File: $deb_file"
                      echo "Size: $(ls -lh "$deb_file" | awk '{print $5}')"
                      echo "Permissions: $(ls -la "$deb_file")"
                    fi
                  done

                  echo "Pipeline workspace contents:"
                  ls -la "$(Pipeline.Workspace)/"
                  echo "=== POST-SIGNING DEBUG END ==="
                displayName: "Debug: Post-Signing"
                condition: succeeded()

              # TODO: Remove debug logging after pipeline is stable
              - bash: |
                  echo "=== ARTIFACT PUBLISHING DEBUG ==="
                  echo "Artifact will be published via 1ES templateContext:"
                  echo "Artifact name: aks-desktop-signed"
                  echo "Source path: $(Pipeline.Workspace)/aks-desktop-deb-unsigned"
                  echo "Artifact contents:"
                  ls -la "$(Pipeline.Workspace)/aks-desktop-deb-unsigned/"
                  echo "Artifact size: $(du -sh "$(Pipeline.Workspace)/aks-desktop-deb-unsigned" 2>/dev/null || echo 'Unable to calculate')"
                  echo "Note: 1ES template will handle the actual artifact publishing"
                  echo "=== END ARTIFACT DEBUG ==="
                displayName: "Debug: Artifact Publishing"
                condition: succeeded()