name: Build aks-desktop (Linux)

on:
  schedule:
    # Runs every day at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      aks_plugin_branch:
        description: 'Branch to build aks-plugin'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.aks_plugin_branch }}
          submodules: false

      - name: Setup nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Resolve Headlamp Go version
        id: go-version
        run: echo "version=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)" >> "$GITHUB_OUTPUT"

      - name: Install golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: |
            packages/headlamp-source/package.json
            patches/*.patch

      - name: Install dependencies
        run: |
          npm_root="$(mktemp -d "$RUNNER_TEMP/npm.XXXXXX")"
          npm install --prefix "$npm_root" --no-save --ignore-scripts --no-audit --no-fund "$(node -p "require('./package.json').packageManager")"
          echo "$npm_root/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$npm_root/node_modules/.bin:$PATH"
          npm ci --prefer-offline --no-audit --no-fund

      - name: Setup AKS desktop and Build Headlamp (Linux)
        run: npm run build:linux:${{ matrix.arch }}

      - name: Validate the packaged application
        run: npm run test:distribution -- --no-sandbox

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aks-desktop-linux-${{ matrix.arch }}
          path: node_modules/@headlamp-k8s/headlamp-source/source/app/dist/aks-desktop*
