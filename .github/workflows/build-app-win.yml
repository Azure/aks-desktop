name: Build aks-desktop (Windows)

on:
  schedule:
    # Runs every day at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      aks_plugin_branch:
        description: 'Branch to build aks-plugin'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      HEADLAMP_REUSE_PLUGIN_DEPENDENCIES: aks-desktop,aks-desktop-theme,insights-plugin,plugin-catalog
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.aks_plugin_branch }}
          submodules: false

      - name: Setup nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: "npm"
          cache-dependency-path: |
            .config/npm/package-lock.json
            package-lock.json
            plugins/*/package-lock.json

      - name: Resolve Headlamp Go version
        id: go-version
        run: echo "version=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)" >> "$GITHUB_OUTPUT"

      - name: Install golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: |
            packages/headlamp-source/package.json
            patches/*.patch

      - name: Setup pinned npm
        shell: pwsh
        run: |
          npm ci --prefix .config/npm --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:GITHUB_WORKSPACE '.config/npm/node_modules/.bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Windows plugin dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: windows-plugin-deps-v2-${{ runner.os }}-${{ runner.arch }}-node-22.22.2-${{ hashFiles('package.json', '.npmrc', 'build/install-dependencies.ts', 'packages/headlamp-source/src/lib/bundle-plugins.ts', 'plugins/*/.npmrc', 'plugins/aks-desktop/package*.json', 'plugins/aks-desktop-theme/package*.json', 'plugins/insights-plugin/package*.json', 'plugins/plugin-catalog/package*.json') }}
          path: |
            plugins/aks-desktop/node_modules
            plugins/aks-desktop-theme/node_modules
            plugins/insights-plugin/node_modules
            plugins/plugin-catalog/node_modules

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup AKS desktop and Build Headlamp (Windows)
        run: npm run build:win:${{ matrix.arch }}
        shell: bash

      - name: Validate the packaged application
        run: npm run test:distribution
        shell: bash

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aks-desktop-win-${{ matrix.arch }}
          path: node_modules/@headlamp-k8s/headlamp-source/source/app/dist/aks-desktop*.*
