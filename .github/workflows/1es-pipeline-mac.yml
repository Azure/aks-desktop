trigger: none

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: nodeVersion
    type: string
    default: 22.22.2

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    featureFlags:
      golang:
        internalModuleProxy:
          enabled: true
    pool:
      name: Azure Pipelines
      image: macOS-latest
      os: macOS
    sdl:
      sourceAnalysisPool:
        name: staging-pool-amd64-mariner-2
        image: azcu-agent-amd64-windows-22-img
        os: windows
        hostArchitecture: amd64
      git:
        submodules: false
        longpaths: true

    stages:
      # ===================================================================
      # SHARED MACOS BUILD - Package Intel and Apple Silicon on one worker
      #
      # AzureContainerUpstream has no available hosted ARM64 macOS runner and
      # only one concurrent hosted macOS job. Separate architecture jobs would
      # therefore serialize while repeating setup. Keep both packages on this
      # Intel worker unless both constraints change; see MAINTENANCE.md.
      # ===================================================================
      - stage: Build_macOS
        displayName: 'Build (x64 + arm64)'
        dependsOn: []
        jobs:
          - job: BuildJob_macOS
            displayName: 'Build macOS Applications (x64 + arm64)'
            timeoutInMinutes: 240
            variables:
              - group: AKS Desktop
              - name: NPM_CONFIG_REGISTRY
                value: https://packagefeedproxy.microsoft.io/npm/
              - name: NPM_CONFIG_REPLACE_REGISTRY_HOST
                value: npmjs
              - name: PIP_INDEX_URL
                value: https://packagefeedproxy.microsoft.io/pypi/simple/
              - name: NPM_CONFIG_CACHE
                value: $(Pipeline.Workspace)/.npm
              - name: GOMODCACHE
                value: $(Pipeline.Workspace)/.go/pkg/mod
              - name: GOCACHE
                value: $(Pipeline.Workspace)/.go/build
              - name: AZ_CLI_EXTENSION_CACHE_ROOT
                value: $(Pipeline.Workspace)/.azure-cli-extensions
              - name: HEADLAMP_SKIP_INSTALL_BACKEND_BUILD
                value: 'true'
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/arm64
                  artifactName: unsigned-dmg-arm64
                  displayName: 'Publish Unsigned DMG (arm64)'
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/x64
                  artifactName: unsigned-dmg-x64
                  displayName: 'Publish Unsigned DMG (x64)'
            steps:
              # Install tools
              - checkout: self
                submodules: false

              - task: NodeTool@0
                displayName: Install Node.js
                retryCountOnTaskFailure: 3
                inputs:
                  versionSpec: ${{ parameters.nodeVersion }}

              - task: UsePythonVersion@0
                displayName: Install extension builder Python
                retryCountOnTaskFailure: 3
                inputs:
                  versionSpec: '3.13'
                  architecture: 'x64'

              - bash: |
                  set -e
                  go_version="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/go-version.ts)"
                  echo "Headlamp Go toolchain: $go_version"
                  echo "##vso[task.setvariable variable=HEADLAMP_GO_VERSION]$go_version"
                displayName: Resolve Headlamp Go version

              - task: GoTool@0
                displayName: Install Go
                retryCountOnTaskFailure: 3
                inputs:
                  version: $(HEADLAMP_GO_VERSION)

              # Cache downloads, not node_modules that npm ci replaces.
              - task: Cache@2
                displayName: 'Cache npm downloads'
                inputs:
                  key: 'npm-download-v2 | "$(Agent.OS)" | package-lock.json | packages/headlamp-source/package-lock.json | plugins/aks-desktop/package-lock.json | plugins/plugin-catalog/package-lock.json'
                  restoreKeys: |
                    npm-download-v2 | "$(Agent.OS)" |
                  path: '$(Pipeline.Workspace)/.npm'

              - bash: |
                  set -e
                  mkdir -p "$(GOMODCACHE)" "$(GOCACHE)"
                  echo "GOMODCACHE=$(go env GOMODCACHE)"
                  echo "GOCACHE=$(go env GOCACHE)"
                  echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
                displayName: 'Configure Go caches'

              - task: Cache@2
                displayName: 'Cache Go module downloads'
                inputs:
                  key: 'go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-mod-v3 | "$(Agent.OS)" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOMODCACHE)'
                  cacheHitVar: GO_MODULE_CACHE_HIT

              - task: Cache@2
                displayName: 'Cache Go build outputs'
                inputs:
                  key: 'go-build-v3 | "$(Agent.OS)" | "macos-all" | "$(HEADLAMP_GO_VERSION)" | "$(Build.SourceVersion)"'
                  restoreKeys: |
                    go-build-v3 | "$(Agent.OS)" | "macos-all" | "$(HEADLAMP_GO_VERSION)" |
                  path: '$(GOCACHE)'
                  cacheHitVar: GO_BUILD_CACHE_HIT

              - bash: |
                  echo "[build-timing] Go module cache result: $(GO_MODULE_CACHE_HIT)"
                  echo "[build-timing] Go build cache result: $(GO_BUILD_CACHE_HIT)"
                displayName: 'Report Go cache results'

              # Download certificates (needed for local signing during build)
              - task: DownloadSecureFile@1
                name: CertJoaquim
                displayName: 'Download CertJoaquim.p12'
                inputs:
                  secureFile: CertJoaquim.p12

              - task: DownloadSecureFile@1
                name: AKSDesktopProvisionProfile
                displayName: 'Download Provisioning Profile'
                inputs:
                  secureFile: AKS_Desktop_Distribution.provisionprofile

              # Setup keychain
              - script: |
                  set -e
                  echo "Setting up keychain and importing certificates..."

                  KEYCHAIN_PATH="$(agent.tempdirectory)/buildagent.keychain"
                  KEYCHAIN_PASSWORD="pwd"

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security default-keychain -s "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings "$KEYCHAIN_PATH"

                  CERT_FILE="$(CertJoaquim.secureFilePath)"
                  CERT_PASSWORD="$(CertPassword)"

                  if [ -z "$CERT_PASSWORD" ]; then
                    CERT_PASSWORD="$(aks-desktop-mac-developer-certificate-key)"
                  fi

                  if [ -z "$CERT_PASSWORD" ]; then
                    security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild || {
                      echo "❌ Failed to import certificate."
                      exit 1
                    }
                  else
                    security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
                  fi

                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH"

                  PROVISION_PROFILE="$(AKSDesktopProvisionProfile.secureFilePath)"
                  if [ -f "$PROVISION_PROFILE" ]; then
                    mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                    cp "$PROVISION_PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/
                  fi

                  security find-identity -v -p codesigning "$KEYCHAIN_PATH"
                  echo "✅ Keychain setup complete"
                displayName: "Setup keychain and import certificates"

              - bash: |
                  set -e
                  step_started=$SECONDS
                  echo "[build-timing] npm bootstrap started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  npm_root="$(mktemp -d "${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/npm.XXXXXX")"
                  npm install --prefix "$npm_root" --no-save --ignore-scripts --no-audit --no-fund "$(node -p "require('./package.json').packageManager")"
                  echo "##vso[task.prependpath]$npm_root/node_modules/.bin"
                  export PATH="$npm_root/node_modules/.bin:$PATH"
                  echo "[build-timing] npm bootstrap completed in $((SECONDS - step_started))s"

                  step_started=$SECONDS
                  echo "[build-timing] root npm ci started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  npm ci --prefer-offline --no-audit --no-fund
                  echo "[build-timing] root npm ci completed in $((SECONDS - step_started))s"
                displayName: 'Install dependencies'

              - bash: |
                  set -e
                  arm64_key="$(node --import tsx build/azure-cli-cache-key.ts --platform=darwin --arch=arm64)"
                  x64_key="$(node --import tsx build/azure-cli-cache-key.ts --platform=darwin --arch=x64)"
                  echo "Azure CLI ARM64 cache identity: $arm64_key"
                  echo "Azure CLI x64 cache identity: $x64_key"
                  echo "##vso[task.setvariable variable=AZ_CLI_CACHE_KEY]$arm64_key-$x64_key"
                  mkdir -p "$(AZ_CLI_EXTENSION_CACHE_ROOT)/arm64" "$(AZ_CLI_EXTENSION_CACHE_ROOT)/x64"
                displayName: 'Resolve Azure CLI extension caches'

              - task: Cache@2
                displayName: 'Cache Azure CLI extensions'
                inputs:
                  key: 'azure-cli-extensions-v2 | "$(Agent.OS)" | "macos-all" | "$(AZ_CLI_CACHE_KEY)"'
                  path: '$(AZ_CLI_EXTENSION_CACHE_ROOT)'
                  cacheHitVar: AZ_CLI_EXTENSION_CACHE_HIT

              - bash: |
                  echo "[build-timing] Azure CLI extension cache result: $(AZ_CLI_EXTENSION_CACHE_HIT)"
                  du -sh "$(AZ_CLI_EXTENSION_CACHE_ROOT)"/* 2>/dev/null || true
                displayName: 'Report Azure CLI cache result'

              - bash: |
                  set -euo pipefail
                  cp $(AKSDesktopProvisionProfile.secureFilePath) ./node_modules/@headlamp-k8s/headlamp-source/source/app/mac/aks-desktop.provisionprofile
                  export NODE_OPTIONS="--max-old-space-size=2048"
                  export GONOPROXY=""
                  export GOPRIVATE=""
                  unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy NO_PROXY no_proxy
                  export CI=true
                  export CSC_KEYCHAIN="$(agent.tempdirectory)/buildagent.keychain"

                  for arch in x64 arm64; do
                    if [ "$arch" = x64 ]; then
                      arch_display='Intel (x64)'
                      verification_command='test:distribution'
                    else
                      arch_display='Apple Silicon (arm64)'
                      verification_command='test:post-build'
                    fi
                    export AZ_CLI_EXTENSION_CACHE_DIR="$(AZ_CLI_EXTENSION_CACHE_ROOT)/$arch"
                    export npm_config_arch="$arch"
                    export npm_config_target_arch="$arch"
                    echo "Building AKS desktop application for $arch_display..."

                    retry_count=0
                    success=false
                    while [ $retry_count -lt 3 ] && [ "$success" = false ]; do
                      echo "[build-timing] build attempt $arch $((retry_count + 1)) started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                      if [ "$arch" = arm64 ]; then
                        if npm run "build:mac:$arch" -- --reuse-prepared-assets; then
                          success=true
                        fi
                      elif npm run "build:mac:$arch"; then
                        success=true
                      fi
                      if [ "$success" = false ]; then
                        retry_count=$((retry_count + 1))
                        echo "[build-timing] build attempt $arch $retry_count failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                        if [ $retry_count -lt 3 ]; then
                          echo "Build failed, retrying in 30 seconds..."
                          sleep 30
                        else
                          echo "Build failed after 3 attempts"
                          exit 1
                        fi
                      else
                        echo "[build-timing] build attempt $arch $((retry_count + 1)) completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                      fi
                    done

                    verification_started=$SECONDS
                    echo "[build-timing] distribution verification $arch started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                    npm run "$verification_command"
                    echo "[build-timing] distribution verification $arch completed in $((SECONDS - verification_started))s"

                    artifact_started=$SECONDS
                    echo "[build-timing] artifact collection $arch started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                    dmg_file="$(find node_modules/@headlamp-k8s/headlamp-source/source/app/dist -type f -name "aks-desktop*-$arch.dmg" -print -quit)"
                    if [ -z "$dmg_file" ]; then
                      echo "No $arch DMG found in the Headlamp app dist"
                      find node_modules/@headlamp-k8s/headlamp-source/source/app/dist -maxdepth 2 -type f -print || true
                      exit 1
                    fi
                    output_dir="$(Build.ArtifactStagingDirectory)/$arch"
                    mkdir -p "$output_dir"
                    cp "$dmg_file" "$output_dir/"
                    ls -la "$output_dir"
                    echo "[build-timing] artifact collection $arch completed in $((SECONDS - artifact_started))s"
                  done
                displayName: 'Build AKS desktop (x64 + arm64)'

      - stage: Sign_arm64
        displayName: 'Sign (arm64)'
        dependsOn: Build_macOS
        condition: succeeded('Build_macOS')
        jobs:
          - job: SignJob_arm64
            displayName: 'ESRP Developer Sign (arm64)'
            timeoutInMinutes: 60
            variables:
              - group: AKS Desktop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Pipeline.Workspace)/signed-dmg
                  artifactName: signed-dmg-arm64
                  displayName: 'Publish Signed DMG (arm64)'
            steps:
              - checkout: none
              
              # Download unsigned DMG from previous stage
              - task: DownloadPipelineArtifact@2
                displayName: 'Download Unsigned DMG (arm64)'
                inputs:
                  artifactName: unsigned-dmg-arm64
                  targetPath: $(Pipeline.Workspace)/unsigned-dmg

              # Verify downloaded artifacts
              - bash: |
                  echo "Verifying downloaded artifacts (arm64)..."
                  ls -la "$(Pipeline.Workspace)/unsigned-dmg/"
                  DMG_COUNT=$(find "$(Pipeline.Workspace)/unsigned-dmg" -name "*.dmg" | wc -l)
                  echo "Found $DMG_COUNT DMG file(s)"
                  if [ "$DMG_COUNT" -eq 0 ]; then
                    echo "❌ No DMG files found!"
                    exit 1
                  fi
                displayName: "Verify Downloaded Artifacts"

              # Create directory for signed output
              - bash: |
                  mkdir -p "$(Pipeline.Workspace)/signed-dmg"
                  cp "$(Pipeline.Workspace)/unsigned-dmg"/*.dmg "$(Pipeline.Workspace)/signed-dmg/"
                  echo "Prepared files for signing:"
                  ls -la "$(Pipeline.Workspace)/signed-dmg/"
                displayName: "Prepare for Signing"

              # ESRP Developer Sign
              - task: EsrpCodeSigning@5
                displayName: "ESRP Developer Sign DMG"
                condition: succeeded()
                inputs:
                  ConnectedServiceName: "ESRP-AME-AZCU"
                  UseMSIAuthentication: true
                  AppRegistrationClientId: "70ebf75b-d46f-46da-90e6-1fa654251514"
                  AppRegistrationTenantId: "33e01921-4d64-4f8c-a055-5bdaffd5e33d"
                  EsrpClientId: "150f8d2b-ad88-4a27-b782-c9bc3b028430"
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
                  AuthAKVName: "upstreamci-ado"
                  AuthCertName: 'azcu-ersp-corp'
                  AuthSignCertName: 'azcu-ersp-corp'
                  FolderPath: "$(Pipeline.Workspace)/signed-dmg"
                  Pattern: "*.dmg"
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-401337-Apple",
                        "OperationCode": "MacAppDeveloperSign",
                        "Parameters": {
                          "Hardening": "--options=runtime"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: 60

              # Verify signatures and extract Bundle ID
              - bash: |
                  set -e
                  echo "=== VERIFYING DEVELOPER SIGNATURES ==="

                  DMG_FILES=$(find "$(Pipeline.Workspace)/signed-dmg" -type f -name "*.dmg")

                  if [ -z "$DMG_FILES" ]; then
                    echo "❌ No DMG files found"
                    exit 1
                  fi

                  FIRST_DMG=$(echo "$DMG_FILES" | head -1)
                  echo "Extracting Bundle ID from: $FIRST_DMG"

                  MOUNT_DIR=$(mktemp -d)
                  hdiutil attach "$FIRST_DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet

                  APP_PATH=$(find "$MOUNT_DIR" -type d -name "*.app" -maxdepth 1 | head -1)

                  if [ -n "$APP_PATH" ]; then
                    INFO_PLIST="$APP_PATH/Contents/Info.plist"
                    if [ -f "$INFO_PLIST" ]; then
                      BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "")

                      if [ -n "$BUNDLE_ID" ]; then
                        echo "✅ Bundle ID: $BUNDLE_ID"
                        echo "##vso[task.setvariable variable=BundleIdentifier;isOutput=true]$BUNDLE_ID"
                      else
                        echo "❌ Failed to extract Bundle ID"
                        exit 1
                      fi
                    fi
                  fi

                  hdiutil detach "$MOUNT_DIR" -quiet || true

                  # Verify all DMGs are signed
                  echo ""
                  echo "Verifying signatures on all DMGs..."
                  echo "$DMG_FILES" | while read -r DMG_PATH; do
                    echo ""
                    echo "=== Verifying: $(basename "$DMG_PATH") ==="

                    if codesign -dvvv "$DMG_PATH" 2>&1 | grep -q "Developer ID Application"; then
                      echo "✅ DMG is signed with Developer ID"
                      codesign -dvvv "$DMG_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
                    else
                      echo "❌ DMG signature verification failed"
                      codesign -dvvv "$DMG_PATH" 2>&1 || true
                      exit 1
                    fi
                  done

                  echo ""
                  echo "=== DEVELOPER SIGNATURE VERIFICATION COMPLETE ==="
                displayName: "Verify Developer Signatures"
                name: VerifySign

      - stage: Notarize_arm64
        displayName: 'Notarize (arm64)'
        dependsOn: Sign_arm64
        condition: succeeded('Sign_arm64')
        variables:
          # Reference the Bundle ID from previous stage
          BundleId: $[ stageDependencies.Sign_arm64.SignJob_arm64.outputs['VerifySign.BundleIdentifier'] ]
        jobs:
          - job: NotarizeJob_arm64
            displayName: 'ESRP Notarization (arm64)'
            timeoutInMinutes: 60
            variables:
              - group: AKS Desktop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Pipeline.Workspace)/notarized-dmg
                  artifactName: aks-desktop-signed-arm64
                  displayName: 'Publish Notarized DMG (arm64)'
            steps:
              - checkout: none
              
              # Download signed DMG from previous stage
              - task: DownloadPipelineArtifact@2
                displayName: 'Download Signed DMG (arm64)'
                inputs:
                  artifactName: signed-dmg-arm64
                  targetPath: $(Pipeline.Workspace)/notarized-dmg

              # Verify downloaded artifacts
              - bash: |
                  echo "Verifying downloaded signed DMG (arm64)..."
                  echo "Bundle ID from previous stage: $(BundleId)"
                  ls -la "$(Pipeline.Workspace)/notarized-dmg/"
                  DMG_COUNT=$(find "$(Pipeline.Workspace)/notarized-dmg" -name "*.dmg" | wc -l)
                  echo "Found $DMG_COUNT DMG file(s)"
                  if [ "$DMG_COUNT" -eq 0 ]; then
                    echo "❌ No DMG files found!"
                    exit 1
                  fi

                  # Verify Bundle ID is set
                  if [ -z "$(BundleId)" ]; then
                    echo "❌ Bundle ID not found! Cannot proceed with notarization."
                    exit 1
                  fi
                displayName: "Verify Pre-Notarization Requirements"

              # ESRP Notarization
              - task: EsrpCodeSigning@5
                displayName: "ESRP Notarization"
                condition: succeeded()
                inputs:
                  ConnectedServiceName: "ESRP-AME-AZCU"
                  UseMSIAuthentication: true
                  AppRegistrationClientId: "70ebf75b-d46f-46da-90e6-1fa654251514"
                  AppRegistrationTenantId: "33e01921-4d64-4f8c-a055-5bdaffd5e33d"
                  EsrpClientId: "150f8d2b-ad88-4a27-b782-c9bc3b028430"
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
                  AuthAKVName: "upstreamci-ado"
                  AuthCertName: 'azcu-ersp-corp'
                  AuthSignCertName: 'azcu-ersp-corp'
                  FolderPath: "$(Pipeline.Workspace)/notarized-dmg"
                  Pattern: "*.dmg"
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-401337-Apple",
                        "OperationCode": "MacAppNotarize",
                        "Parameters": {
                          "BundleId": "$(BundleId)"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: 240

              # Verify notarization
              - bash: |
                  set -e
                  echo "=== VERIFYING NOTARIZED DMGs ==="

                  DMG_FILES=$(find "$(Pipeline.Workspace)/notarized-dmg" -type f -name "*.dmg")

                  if [ -z "$DMG_FILES" ]; then
                    echo "❌ No DMG files found"
                    exit 1
                  fi

                  echo "$DMG_FILES" | while read -r DMG_PATH; do
                    echo ""
                    echo "=== Verifying: $(basename "$DMG_PATH") ==="
                    echo "File size: $(ls -lh "$DMG_PATH" | awk '{print $5}')"

                    VERIFY_DIR=$(mktemp -d)
                    hdiutil attach "$DMG_PATH" -mountpoint "$VERIFY_DIR" -nobrowse -quiet

                    APP_FOR_VERIFY=$(find "$VERIFY_DIR" -type d -name "*.app" -maxdepth 1 | head -1)

                    if [ -n "$APP_FOR_VERIFY" ]; then
                      echo "Checking notarization status..."
                      if spctl -a -vv -t install "$APP_FOR_VERIFY" 2>&1 | grep -q "accepted"; then
                        echo "✅ App is notarized and accepted by Gatekeeper"
                      else
                        echo "⚠️ Notarization status check:"
                        spctl -a -vv -t install "$APP_FOR_VERIFY" 2>&1 || true
                      fi

                      echo ""
                      echo "Verifying code signature..."
                      codesign -vvv --deep --strict "$APP_FOR_VERIFY" 2>&1 || echo "Code signature check complete"
                    else
                      echo "⚠️ No .app bundle found in DMG"
                    fi

                    hdiutil detach "$VERIFY_DIR" -quiet || true
                  done

                  echo ""
                  echo "=== NOTARIZATION VERIFICATION COMPLETE ==="
                displayName: "Verify Notarized DMGs"

      - stage: Sign_x64
        displayName: 'Sign (x64)'
        dependsOn: Build_macOS
        condition: succeeded('Build_macOS')
        jobs:
          - job: SignJob_x64
            displayName: 'ESRP Developer Sign (x64)'
            timeoutInMinutes: 60
            variables:
              - group: AKS Desktop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Pipeline.Workspace)/signed-dmg
                  artifactName: signed-dmg-x64
                  displayName: 'Publish Signed DMG (x64)'
            steps:
              - checkout: none
              
              # Download unsigned DMG from previous stage
              - task: DownloadPipelineArtifact@2
                displayName: 'Download Unsigned DMG (x64)'
                inputs:
                  artifactName: unsigned-dmg-x64
                  targetPath: $(Pipeline.Workspace)/unsigned-dmg

              # Verify downloaded artifacts
              - bash: |
                  echo "Verifying downloaded artifacts (x64)..."
                  ls -la "$(Pipeline.Workspace)/unsigned-dmg/"
                  DMG_COUNT=$(find "$(Pipeline.Workspace)/unsigned-dmg" -name "*.dmg" | wc -l)
                  echo "Found $DMG_COUNT DMG file(s)"
                  if [ "$DMG_COUNT" -eq 0 ]; then
                    echo "❌ No DMG files found!"
                    exit 1
                  fi
                displayName: "Verify Downloaded Artifacts"

              # Create directory for signed output
              - bash: |
                  mkdir -p "$(Pipeline.Workspace)/signed-dmg"
                  cp "$(Pipeline.Workspace)/unsigned-dmg"/*.dmg "$(Pipeline.Workspace)/signed-dmg/"
                  echo "Prepared files for signing:"
                  ls -la "$(Pipeline.Workspace)/signed-dmg/"
                displayName: "Prepare for Signing"

              # ESRP Developer Sign
              - task: EsrpCodeSigning@5
                displayName: "ESRP Developer Sign DMG"
                condition: succeeded()
                inputs:
                  ConnectedServiceName: "ESRP-AME-AZCU"
                  UseMSIAuthentication: true
                  AppRegistrationClientId: "70ebf75b-d46f-46da-90e6-1fa654251514"
                  AppRegistrationTenantId: "33e01921-4d64-4f8c-a055-5bdaffd5e33d"
                  EsrpClientId: "150f8d2b-ad88-4a27-b782-c9bc3b028430"
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
                  AuthAKVName: "upstreamci-ado"
                  AuthCertName: 'azcu-ersp-corp'
                  AuthSignCertName: 'azcu-ersp-corp'
                  FolderPath: "$(Pipeline.Workspace)/signed-dmg"
                  Pattern: "*.dmg"
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-401337-Apple",
                        "OperationCode": "MacAppDeveloperSign",
                        "Parameters": {
                          "Hardening": "--options=runtime"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: 60

              # Verify signatures and extract Bundle ID
              - bash: |
                  set -e
                  echo "=== VERIFYING DEVELOPER SIGNATURES ==="

                  DMG_FILES=$(find "$(Pipeline.Workspace)/signed-dmg" -type f -name "*.dmg")

                  if [ -z "$DMG_FILES" ]; then
                    echo "❌ No DMG files found"
                    exit 1
                  fi

                  FIRST_DMG=$(echo "$DMG_FILES" | head -1)
                  echo "Extracting Bundle ID from: $FIRST_DMG"

                  MOUNT_DIR=$(mktemp -d)
                  hdiutil attach "$FIRST_DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet

                  APP_PATH=$(find "$MOUNT_DIR" -type d -name "*.app" -maxdepth 1 | head -1)

                  if [ -n "$APP_PATH" ]; then
                    INFO_PLIST="$APP_PATH/Contents/Info.plist"
                    if [ -f "$INFO_PLIST" ]; then
                      BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "")

                      if [ -n "$BUNDLE_ID" ]; then
                        echo "✅ Bundle ID: $BUNDLE_ID"
                        echo "##vso[task.setvariable variable=BundleIdentifier;isOutput=true]$BUNDLE_ID"
                      else
                        echo "❌ Failed to extract Bundle ID"
                        exit 1
                      fi
                    fi
                  fi

                  hdiutil detach "$MOUNT_DIR" -quiet || true

                  # Verify all DMGs are signed
                  echo ""
                  echo "Verifying signatures on all DMGs..."
                  echo "$DMG_FILES" | while read -r DMG_PATH; do
                    echo ""
                    echo "=== Verifying: $(basename "$DMG_PATH") ==="

                    if codesign -dvvv "$DMG_PATH" 2>&1 | grep -q "Developer ID Application"; then
                      echo "✅ DMG is signed with Developer ID"
                      codesign -dvvv "$DMG_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
                    else
                      echo "❌ DMG signature verification failed"
                      codesign -dvvv "$DMG_PATH" 2>&1 || true
                      exit 1
                    fi
                  done

                  echo ""
                  echo "=== DEVELOPER SIGNATURE VERIFICATION COMPLETE ==="
                displayName: "Verify Developer Signatures"
                name: VerifySign

      - stage: Notarize_x64
        displayName: 'Notarize (x64)'
        dependsOn: Sign_x64
        condition: succeeded('Sign_x64')
        variables:
          # Reference the Bundle ID from previous stage
          BundleId: $[ stageDependencies.Sign_x64.SignJob_x64.outputs['VerifySign.BundleIdentifier'] ]
        jobs:
          - job: NotarizeJob_x64
            displayName: 'ESRP Notarization (x64)'
            timeoutInMinutes: 60
            variables:
              - group: AKS Desktop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Pipeline.Workspace)/notarized-dmg
                  artifactName: aks-desktop-signed-x64
                  displayName: 'Publish Notarized DMG (x64)'
            steps:
              - checkout: none
              
              # Download signed DMG from previous stage
              - task: DownloadPipelineArtifact@2
                displayName: 'Download Signed DMG (x64)'
                inputs:
                  artifactName: signed-dmg-x64
                  targetPath: $(Pipeline.Workspace)/notarized-dmg

              # Verify downloaded artifacts
              - bash: |
                  echo "Verifying downloaded signed DMG (x64)..."
                  echo "Bundle ID from previous stage: $(BundleId)"
                  ls -la "$(Pipeline.Workspace)/notarized-dmg/"
                  DMG_COUNT=$(find "$(Pipeline.Workspace)/notarized-dmg" -name "*.dmg" | wc -l)
                  echo "Found $DMG_COUNT DMG file(s)"
                  if [ "$DMG_COUNT" -eq 0 ]; then
                    echo "❌ No DMG files found!"
                    exit 1
                  fi

                  # Verify Bundle ID is set
                  if [ -z "$(BundleId)" ]; then
                    echo "❌ Bundle ID not found! Cannot proceed with notarization."
                    exit 1
                  fi
                displayName: "Verify Pre-Notarization Requirements"

              # ESRP Notarization
              - task: EsrpCodeSigning@5
                displayName: "ESRP Notarization"
                condition: succeeded()
                inputs:
                  ConnectedServiceName: "ESRP-AME-AZCU"
                  UseMSIAuthentication: true
                  AppRegistrationClientId: "70ebf75b-d46f-46da-90e6-1fa654251514"
                  AppRegistrationTenantId: "33e01921-4d64-4f8c-a055-5bdaffd5e33d"
                  EsrpClientId: "150f8d2b-ad88-4a27-b782-c9bc3b028430"
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
                  AuthAKVName: "upstreamci-ado"
                  AuthCertName: 'azcu-ersp-corp'
                  AuthSignCertName: 'azcu-ersp-corp'
                  FolderPath: "$(Pipeline.Workspace)/notarized-dmg"
                  Pattern: "*.dmg"
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-401337-Apple",
                        "OperationCode": "MacAppNotarize",
                        "Parameters": {
                          "BundleId": "$(BundleId)"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: 240

              # Verify notarization
              - bash: |
                  set -e
                  echo "=== VERIFYING NOTARIZED DMGs ==="

                  DMG_FILES=$(find "$(Pipeline.Workspace)/notarized-dmg" -type f -name "*.dmg")

                  if [ -z "$DMG_FILES" ]; then
                    echo "❌ No DMG files found"
                    exit 1
                  fi

                  echo "$DMG_FILES" | while read -r DMG_PATH; do
                    echo ""
                    echo "=== Verifying: $(basename "$DMG_PATH") ==="
                    echo "File size: $(ls -lh "$DMG_PATH" | awk '{print $5}')"

                    VERIFY_DIR=$(mktemp -d)
                    hdiutil attach "$DMG_PATH" -mountpoint "$VERIFY_DIR" -nobrowse -quiet

                    APP_FOR_VERIFY=$(find "$VERIFY_DIR" -type d -name "*.app" -maxdepth 1 | head -1)

                    if [ -n "$APP_FOR_VERIFY" ]; then
                      echo "Checking notarization status..."
                      if spctl -a -vv -t install "$APP_FOR_VERIFY" 2>&1 | grep -q "accepted"; then
                        echo "✅ App is notarized and accepted by Gatekeeper"
                      else
                        echo "⚠️ Notarization status check:"
                        spctl -a -vv -t install "$APP_FOR_VERIFY" 2>&1 || true
                      fi

                      echo ""
                      echo "Verifying code signature..."
                      codesign -vvv --deep --strict "$APP_FOR_VERIFY" 2>&1 || echo "Code signature check complete"
                    else
                      echo "⚠️ No .app bundle found in DMG"
                    fi

                    hdiutil detach "$VERIFY_DIR" -quiet || true
                  done

                  echo ""
                  echo "=== NOTARIZATION VERIFICATION COMPLETE ==="
                displayName: "Verify Notarized DMGs"