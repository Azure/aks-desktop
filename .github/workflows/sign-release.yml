name: Sign release checksums

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag containing final production artifacts (for example v0.10.0)'
        required: true
        type: string
      allow_published:
        description: 'Explicitly allow retrospective signing of a published release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-signing-${{ inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require the trusted workflow branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main to match the documented signing identity."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_PUBLISHED: ${{ inputs.allow_published }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types build/sign-release.ts
